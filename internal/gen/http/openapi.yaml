swagger: "2.0"
info:
    title: ""
    license:
        name: Apache 2.0
        url: https://github.com/oleshko-g/gophermart/blob/dev/LICENSE
    version: "1.0"
host: localhost:80
consumes:
    - text/plain
    - application/json
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /api/openapi.yaml:
        get:
            tags:
                - docs
            summary: Download ./internal/gen/http/openapi.yaml
            description: OpenAPI 2.0
            operationId: docs#/api/openapi.yaml
            responses:
                "200":
                    description: File downloaded
                    schema:
                        type: file
            schemes:
                - http
    /api/openapi3.yaml:
        get:
            tags:
                - docs
            summary: Download ./internal/gen/http/openapi3.yaml
            description: OpenAPI 3.0
            operationId: docs#/api/openapi3.yaml
            responses:
                "200":
                    description: File downloaded
                    schema:
                        type: file
            schemes:
                - http
    /api/user/balance:
        get:
            tags:
                - balance
            summary: GetUserBalance balance
            description: Get user balance
            operationId: balance#GetUserBalance
            parameters:
                - name: Authorization
                  in: header
                  description: A JWT token used to authenticate a request
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/BalanceGetUserBalanceResponseBody'
                        required:
                            - current
                            - withdrawn
                "401":
                    description: Missing or empty Authorization header
                    headers:
                        goa-attribute-fault:
                            description: Is the error a server-side fault?
                            type: boolean
                        goa-attribute-id:
                            description: ID is a unique identifier for this particular occurrence of the problem.
                            type: string
                        goa-attribute-message:
                            description: Message is a human-readable explanation specific to this occurrence of the problem.
                            type: string
                        goa-attribute-name:
                            description: Name is the name of this class of errors.
                            type: string
                        goa-attribute-temporary:
                            description: Is the error temporary?
                            type: boolean
                        goa-attribute-timeout:
                            description: Is the error a timeout?
                            type: boolean
                "500":
                    description: Internal Server Error response.
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /api/user/balance/withdraw:
        post:
            tags:
                - balance
            summary: WithdrawUserBalance balance
            operationId: balance#WithdrawUserBalance
            parameters:
                - name: Authorization
                  in: header
                  description: A JWT token used to authenticate a request
                  required: true
                  type: string
                - name: WithdrawUserBalanceRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/BalanceWithdrawUserBalanceRequestBody'
                    required:
                        - order
                        - sum
            responses:
                "200":
                    description: OK response.
                "401":
                    description: Missing or empty Authorization header
                    headers:
                        goa-attribute-fault:
                            description: Is the error a server-side fault?
                            type: boolean
                        goa-attribute-id:
                            description: ID is a unique identifier for this particular occurrence of the problem.
                            type: string
                        goa-attribute-message:
                            description: Message is a human-readable explanation specific to this occurrence of the problem.
                            type: string
                        goa-attribute-name:
                            description: Name is the name of this class of errors.
                            type: string
                        goa-attribute-temporary:
                            description: Is the error temporary?
                            type: boolean
                        goa-attribute-timeout:
                            description: Is the error a timeout?
                            type: boolean
                "402":
                    description: Insufficient funds
                "422":
                    description: Invalid order number
                "500":
                    description: Internal Server Error response.
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /api/user/login:
        post:
            tags:
                - user
            summary: login user
            operationId: user#login
            parameters:
                - name: LoginRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LoginPassword'
                    required:
                        - login
                        - password
            responses:
                "200":
                    description: OK response.
                    headers:
                        Authorization:
                            description: A JWT token used to authenticate a request
                            type: string
                "400":
                    description: Bad Request response.
                "401":
                    description: User is not authenticated
                "500":
                    description: Internal Server Error response.
            schemes:
                - http
    /api/user/orders:
        get:
            tags:
                - balance
            summary: ListUserOrders balance
            description: List user orders
            operationId: balance#ListUserOrders
            parameters:
                - name: Authorization
                  in: header
                  description: A JWT token used to authenticate a request
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Order'
                "204":
                    description: No orders available
                "401":
                    description: Missing or empty Authorization header
                    headers:
                        goa-attribute-fault:
                            description: Is the error a server-side fault?
                            type: boolean
                        goa-attribute-id:
                            description: ID is a unique identifier for this particular occurrence of the problem.
                            type: string
                        goa-attribute-message:
                            description: Message is a human-readable explanation specific to this occurrence of the problem.
                            type: string
                        goa-attribute-name:
                            description: Name is the name of this class of errors.
                            type: string
                        goa-attribute-temporary:
                            description: Is the error temporary?
                            type: boolean
                        goa-attribute-timeout:
                            description: Is the error a timeout?
                            type: boolean
                "500":
                    description: Internal Server Error response.
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
        post:
            tags:
                - balance
            summary: UploadUserOrder balance
            description: Upload user order
            operationId: balance#UploadUserOrder
            parameters:
                - name: Authorization
                  in: header
                  description: A JWT token used to authenticate a request
                  required: true
                  type: string
                - name: string
                  in: body
                  description: Unique user order number
                  required: true
                  schema:
                    type: string
                    pattern: '[1-9][0-9]*'
            responses:
                "200":
                    description: The order has been accepted for processing before.
                "202":
                    description: The order has been accepted for processing.
                "400":
                    description: Bad Request response.
                "401":
                    description: Missing or empty Authorization header
                    headers:
                        goa-attribute-fault:
                            description: Is the error a server-side fault?
                            type: boolean
                        goa-attribute-id:
                            description: ID is a unique identifier for this particular occurrence of the problem.
                            type: string
                        goa-attribute-message:
                            description: Message is a human-readable explanation specific to this occurrence of the problem.
                            type: string
                        goa-attribute-name:
                            description: Name is the name of this class of errors.
                            type: string
                        goa-attribute-temporary:
                            description: Is the error temporary?
                            type: boolean
                        goa-attribute-timeout:
                            description: Is the error a timeout?
                            type: boolean
                "409":
                    description: The order belongs to another user
                "422":
                    description: Invalid order number
                "500":
                    description: Internal Server Error response.
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /api/user/register:
        post:
            tags:
                - user
            summary: register user
            operationId: user#register
            parameters:
                - name: RegisterRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LoginPassword'
                    required:
                        - login
                        - password
            responses:
                "200":
                    description: OK response.
                    headers:
                        Authorization:
                            description: A JWT token used to authenticate a request
                            type: string
                "400":
                    description: Bad Request response.
                "409":
                    description: Login is taken already
                "500":
                    description: Internal Server Error response.
            schemes:
                - http
    /api/user/withdrawals:
        get:
            tags:
                - balance
            summary: GetWithdrawals balance
            operationId: balance#GetWithdrawals
            parameters:
                - name: Authorization
                  in: header
                  description: A JWT token used to authenticate a request
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Withdrawal'
                "204":
                    description: User has no withdrawals
                "400":
                    description: Bad Request response.
                "401":
                    description: Missing or empty Authorization header
                    headers:
                        goa-attribute-fault:
                            description: Is the error a server-side fault?
                            type: boolean
                        goa-attribute-id:
                            description: ID is a unique identifier for this particular occurrence of the problem.
                            type: string
                        goa-attribute-message:
                            description: Message is a human-readable explanation specific to this occurrence of the problem.
                            type: string
                        goa-attribute-name:
                            description: Name is the name of this class of errors.
                            type: string
                        goa-attribute-temporary:
                            description: Is the error temporary?
                            type: boolean
                        goa-attribute-timeout:
                            description: Is the error a timeout?
                            type: boolean
                "500":
                    description: Internal Server Error response.
                "501":
                    description: Not Implemented response.
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
definitions:
    BalanceGetUserBalanceResponseBody:
        title: BalanceGetUserBalanceResponseBody
        type: object
        properties:
            current:
                type: number
                example: 0.632111522408537
                format: double
                minimum: 0
            withdrawn:
                type: number
                example: 0.4321690176467999
                format: double
                minimum: 0
        example:
            current: 500.5
            withdrawn: 42
        required:
            - current
            - withdrawn
    BalanceWithdrawUserBalanceRequestBody:
        title: BalanceWithdrawUserBalanceRequestBody
        type: object
        properties:
            order:
                type: string
                example: "129"
                pattern: '[1-9][0-9]*'
            sum:
                type: number
                example: 0.18044734170140514
                format: double
                exclusiveMinimum: 0
        example:
            order: "2377225624"
            sum: 751
        required:
            - order
            - sum
    GophermartError:
        title: GophermartError
        type: object
        example: {}
    LoginPassword:
        title: LoginPassword
        type: object
        properties:
            login:
                type: string
                example: Corrupti tempora.
            password:
                type: string
                example: Odio cupiditate voluptatem ullam voluptatibus.
        example:
            login: <login>
            password: <password>
        required:
            - login
            - password
    Order:
        title: Order
        type: object
        properties:
            accrual:
                type: number
                example: 0.7063003793160709
                format: double
                exclusiveMinimum: 0
            number:
                type: string
                example: "7"
                pattern: '[1-9][0-9]*'
            status:
                type: string
                example: INVALID
                enum:
                    - NEW
                    - PROCESSING
                    - INVALID
                    - PROCESSED
            uploaded_at:
                type: string
                example: "2013-11-28T07:13:27Z"
                format: date-time
        example:
            accrual: 0.817587073945762
            number: "16"
            status: PROCESSING
            uploaded_at: "2002-07-02T04:00:32Z"
        required:
            - number
            - status
            - uploaded_at
    Withdrawal:
        title: Withdrawal
        type: object
        properties:
            order:
                type: string
                example: "3"
                pattern: '[1-9][0-9]*'
            processed_at:
                type: string
                example: "1971-11-03T09:32:57Z"
                format: date-time
            sum:
                type: number
                example: 0.3222794260571369
                format: double
                exclusiveMinimum: 0
        example:
            order: "7"
            processed_at: "1977-03-16T23:23:31Z"
            sum: 0.785491523493923
securityDefinitions:
    jwt_header_Authorization:
        type: apiKey
        description: Secures an endpoint by requiring a valid JWT token.
        name: Authorization
        in: header
